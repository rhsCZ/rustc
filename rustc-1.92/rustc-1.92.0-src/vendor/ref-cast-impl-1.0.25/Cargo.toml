[dependencies.proc-macro2]
version = "1.0.74"

[dependencies.quote]
version = "1.0.35"

[dependencies.syn]
version = "2.0.46"

[dev-dependencies.ref-cast]
version = "1"

[lib]
path = "src/lib.rs"

[package]
authors = ["David Tolnay <dtolnay@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "Derive implementation for ref_cast::RefCast."
documentation = "https://docs.rs/ref-cast"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "ref-cast-impl"
readme = false
repository = "https://github.com/dtolnay/ref-cast"
rust-version = "1.61"
version = "1.0.25"

[package.metadata.docs.rs]
rustdoc-args = ["--generate-link-to-definition", "--generate-macro-expansion", "--extern-html-root-url=core=https://doc.rust-lang.org", "--extern-html-root-url=alloc=https://doc.rust-lang.org", "--extern-html-root-url=std=https://doc.rust-lang.org", "--extern-html-root-url=proc_macro=https://doc.rust-lang.org"]
targets = ["x86_64-unknown-linux-gnu"]

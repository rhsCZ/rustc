[dependencies.proc-macro2]
version = "1.0.74"

[dependencies.quote]
version = "1.0.35"

[dependencies.serde_derive_internals]
version = "0.29.1"

[dependencies.syn]
version = "2.0.46"

[dev-dependencies.pretty_assertions]
version = "1.2.1"


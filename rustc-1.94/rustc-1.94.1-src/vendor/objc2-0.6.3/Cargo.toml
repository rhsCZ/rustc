[dependencies.objc2-encode]
default-features = false
version = "4.1.0"

[dependencies.objc2-exception-helper]
default-features = false
optional = true
version = "0.1.1"

[dependencies.objc2-proc-macros]
optional = true
version = "0.2.0"

[dev-dependencies.backtrace]
version = "0.3.74"

[dev-dependencies.iai]
version = "0.1"

[dev-dependencies.libc]
version = "0.2.158"

[dev-dependencies.memoffset]
version = "0.9.0"

[dev-dependencies.static_assertions]
version = "1.1.0"

[features]
alloc = ["objc2-encode/alloc"]
catch-all = ["exception"]
default = ["std"]
disable-encoding-assertions = []
exception = ["dep:objc2-exception-helper"]
gnustep-1-7 = ["unstable-static-class", "objc2-exception-helper?/gnustep-1-7"]
gnustep-1-8 = ["gnustep-1-7", "objc2-exception-helper?/gnustep-1-8"]
gnustep-1-9 = ["gnustep-1-8", "objc2-exception-helper?/gnustep-1-9"]
gnustep-2-0 = ["gnustep-1-9", "objc2-exception-helper?/gnustep-2-0"]
gnustep-2-1 = ["gnustep-2-0", "objc2-exception-helper?/gnustep-2-1"]
objc2-proc-macros = []
relax-sign-encoding = []
relax-void-encoding = []
std = ["alloc", "objc2-encode/std"]
unstable-apple-new = []
unstable-arbitrary-self-types = []
unstable-autoreleasesafe = []
unstable-coerce-pointee = []
unstable-compiler-rt = ["gnustep-1-7"]
unstable-gnustep-strict-apple-compat = ["gnustep-1-7"]
unstable-objfw = []
unstable-requires-macos = []
unstable-static-class = ["dep:objc2-proc-macros"]
unstable-static-class-inlined = ["unstable-static-class"]
unstable-static-sel = ["dep:objc2-proc-macros"]
unstable-static-sel-inlined = ["unstable-static-sel"]
unstable-winobjc = ["gnustep-1-8"]
verify = []

[lib]
path = "src/lib.rs"

[lints.clippy]
ptr_as_ptr = "warn"
redundant_feature_names = "allow"

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.rust]
elided_lifetimes_in_paths = "warn"
missing_copy_implementations = "warn"
non_ascii_idents = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[package]
authors = ["Mads Marquart <mads@marquart.dk>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["external-ffi-bindings", "api-bindings", "development-tools::ffi", "os::macos-apis"]
description = "Objective-C interface and runtime bindings"
edition = "2021"
keywords = ["objective-c", "macos", "ios", "objc_msgSend", "objc"]
license = "MIT"
name = "objc2"
readme = "README.md"
repository = "https://github.com/madsmtm/objc2"
rust-version = "1.71"
version = "0.6.3"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
features = ["exception"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-tvos", "aarch64-apple-watchos", "aarch64-apple-ios-macabi", "aarch64-apple-visionos", "x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu"]

[package.metadata.release]
shared-version = false
tag-prefix = "objc2"

[target.'cfg(all(target_vendor = "apple", not(target_os = "macos")))'.dev-dependencies]

[target.'cfg(target_os = "macos")'.dev-dependencies]

[target.'cfg(target_vendor = "apple")'.dev-dependencies.core-foundation]
version = "0.10.0"

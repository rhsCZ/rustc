[badges.maintenance]
status = "actively-developed"

[dependencies.log]
optional = true
version = "0.4.17"

[dependencies.pin-project-lite]
version = "0.2.9"

[dependencies.tracing-attributes]
optional = true
version = "0.1.28"

[dependencies.tracing-core]
default-features = false
version = "0.1.33"

[dev-dependencies.criterion]
default-features = false
version = "0.3.6"

[dev-dependencies.futures]
default-features = false
version = "0.3.21"

[dev-dependencies.log]
version = "0.4.17"

[features]
async-await = []
attributes = ["tracing-attributes"]
default = ["std", "attributes"]
log-always = ["log"]
max_level_debug = []
max_level_error = []
max_level_info = []
max_level_off = []
max_level_trace = []
max_level_warn = []
release_max_level_debug = []
release_max_level_error = []
release_max_level_info = []
release_max_level_off = []
release_max_level_trace = []
release_max_level_warn = []
std = ["tracing-core/std"]
valuable = ["tracing-core/valuable"]

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(flaky_tests)", "cfg(tracing_unstable)"]
level = "warn"
priority = 0

[package]
authors = ["Eliza Weisman <eliza@buoyant.io>", "Tokio Contributors <team@tokio.rs>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
categories = ["development-tools::debugging", "development-tools::profiling", "asynchronous", "no-std"]
description = """
Application-level tracing for Rust.
"""
edition = "2018"
homepage = "https://tokio.rs"
keywords = ["logging", "tracing", "metrics", "async"]
license = "MIT"
name = "tracing"
readme = "README.md"
repository = "https://github.com/tokio-rs/tracing"
resolver = "2"
rust-version = "1.63.0"
version = "0.1.41"

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "tracing_unstable"]
rustdoc-args = ["--cfg", "docsrs", "--cfg", "tracing_unstable"]

[target.'cfg(target_arch = "wasm32")'.dev-dependencies.wasm-bindgen-test]
version = "0.3.38"

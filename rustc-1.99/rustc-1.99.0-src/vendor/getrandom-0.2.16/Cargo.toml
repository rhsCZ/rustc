[dependencies.cfg-if]
version = "1"

[dependencies.compiler_builtins]
optional = true
version = "0.1"

[dependencies.core]
optional = true
package = "rustc-std-workspace-core"
version = "1.0"

[features]
custom = []
js = ["wasm-bindgen", "js-sys"]
linux_disable_fallback = []
rdrand = []
rustc-dep-of-std = ["compiler_builtins", "core", "libc/rustc-dep-of-std", "wasi/rustc-dep-of-std"]
std = []
test-in-browser = []

[lib]
path = "src/lib.rs"

[package]
authors = ["The Rand Project Developers"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["os", "no-std"]
description = "A small cross-platform library for retrieving random data from system source"
documentation = "https://docs.rs/getrandom"
edition = "2018"
exclude = [".*"]
license = "MIT OR Apache-2.0"
name = "getrandom"
readme = "README.md"
repository = "https://github.com/rust-random/getrandom"
version = "0.2.16"

[package.metadata.cross.target.x86_64-unknown-netbsd]
pre-build = ["mkdir -p /tmp/netbsd", "curl https://cdn.netbsd.org/pub/NetBSD/NetBSD-9.2/amd64/binary/sets/base.tar.xz -O", "tar -C /tmp/netbsd -xJf base.tar.xz", "cp /tmp/netbsd/usr/lib/libexecinfo.so /usr/local/x86_64-unknown-netbsd/lib", "rm base.tar.xz", "rm -rf /tmp/netbsd"]

[package.metadata.docs.rs]
features = ["std", "custom"]
rustdoc-args = ["--cfg", "docsrs"]

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies.js-sys]
optional = true
version = "0.3"

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dependencies.wasm-bindgen]
default-features = false
optional = true
version = "0.2.62"

[target.'cfg(all(any(target_arch = "wasm32", target_arch = "wasm64"), target_os = "unknown"))'.dev-dependencies.wasm-bindgen-test]
version = "0.3.18"

[target.'cfg(target_os = "wasi")'.dependencies.wasi]
default-features = false
version = "0.11"

[target."cfg(unix)".dependencies.libc]
default-features = false
version = "0.2.154"

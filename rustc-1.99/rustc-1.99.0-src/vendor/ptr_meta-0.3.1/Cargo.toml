[dependencies.ptr_meta_derive]
default-features = false
optional = true
version = "=0.3.1"

[features]
default = ["derive", "std"]
derive = ["ptr_meta_derive"]
std = []

[lib]
path = "src/lib.rs"

[package]
authors = ["David Koloski <djkoloski@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["no-std", "no-std::no-alloc"]
description = "A radioactive stabilization of the ptr_meta rfc"
documentation = "https://docs.rs/ptr_meta"
edition = "2021"
keywords = ["no_std"]
license = "MIT"
name = "ptr_meta"
readme = "README.md"
repository = "https://github.com/rkyv/ptr_meta"
rust-version = "1.81"
version = "0.3.1"

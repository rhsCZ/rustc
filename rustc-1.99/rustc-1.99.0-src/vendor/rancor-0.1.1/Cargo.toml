[dependencies.ptr_meta]
default-features = false
features = ["derive"]
version = "0.3"

[features]
alloc = []
default = ["alloc"]

[lib]
path = "src/lib.rs"

[package]
authors = ["David Koloski <djkoloski@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["rust-patterns", "no-std"]
description = "Scalable and efficient error handling without type composition"
documentation = "https://docs.rs/rancor"
edition = "2021"
keywords = ["error", "error-handling", "no_std"]
license = "MIT"
name = "rancor"
readme = "README.md"
repository = "https://github.com/rkyv/rancor"
rust-version = "1.81"
version = "0.1.1"

[dependencies.proc-macro2]
default-features = false
features = ["proc-macro"]
version = "1"

[dependencies.quote]
default-features = false
features = ["proc-macro"]
version = "1"

[dependencies.syn]
default-features = false
features = ["clone-impls", "derive", "full", "parsing", "printing", "proc-macro"]
version = "2"

[lib]
path = "src/lib.rs"

[package]
authors = ["David Koloski <djkoloski@gmail.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["no-std", "no-std::no-alloc"]
description = "Proc macros for ptr_meta"
documentation = "https://docs.rs/ptr_meta_derive"
edition = "2021"
keywords = ["no_std"]
license = "MIT"
name = "ptr_meta_derive"
readme = "README.md"
repository = "https://github.com/rkyv/ptr_meta"
rust-version = "1.81"
version = "0.3.1"

[badges.maintenance]
status = "as-is"

[dependencies.windows-sys]
features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"]
version = ">=0.60, <=0.61"

[dev-dependencies.rand]
version = "0.8.0"

[dev-dependencies.socket2]
version = "0.6.0"

[lib]
path = "src/lib.rs"

[package]
authors = ["Alex Crichton <alex@alexcrichton.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = """
A zero overhead I/O library for Windows, focusing on IOCP and async I/O
abstractions.
"""
edition = "2018"
homepage = "https://github.com/yoshuawuyts/miow"
keywords = ["iocp", "windows", "io", "overlapped"]
license = "MIT OR Apache-2.0"
name = "miow"
readme = "README.md"
repository = "https://github.com/yoshuawuyts/miow"
rust-version = "1.77"
version = "0.6.1"

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["aarch64-pc-windows-msvc", "i686-pc-windows-msvc", "x86_64-pc-windows-msvc"]

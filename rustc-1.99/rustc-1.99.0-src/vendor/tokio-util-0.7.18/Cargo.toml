[dependencies.bytes]
version = "1.5.0"

[dependencies.futures-core]
version = "0.3.0"

[dependencies.futures-io]
optional = true
version = "0.3.0"

[dependencies.futures-sink]
version = "0.3.0"

[dependencies.futures-util]
optional = true
version = "0.3.0"

[dependencies.hashbrown]
default-features = false
optional = true
version = "0.15.0"

[dependencies.pin-project-lite]
version = "0.2.11"

[dependencies.slab]
optional = true
version = "0.4.4"

[dependencies.tokio]
features = ["sync"]
version = "1.44.0"

[dependencies.tracing]
default-features = false
features = ["std"]
optional = true
version = "0.1.29"

[dev-dependencies.async-stream]
version = "0.3.0"

[dev-dependencies.futures]
version = "0.3.0"

[dev-dependencies.futures-test]
version = "0.3.5"

[dev-dependencies.parking_lot]
version = "0.12.0"

[dev-dependencies.tempfile]
version = "3.1.0"

[dev-dependencies.tokio]
features = ["full"]
version = "1.0.0"

[dev-dependencies.tokio-stream]
version = "0.1"

[dev-dependencies.tokio-test]
version = "0.4.0"

[features]
__docs_rs = ["futures-util"]
codec = []
compat = ["futures-io"]
default = []
full = ["codec", "compat", "io-util", "time", "net", "rt", "join-map"]
io = []
io-util = ["io", "tokio/rt", "tokio/io-util"]
join-map = ["rt", "hashbrown"]
net = ["tokio/net"]
rt = ["tokio/rt", "tokio/sync", "futures-util"]
time = ["tokio/time", "slab"]

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(fuzzing)", "cfg(loom)", "cfg(mio_unsupported_force_poll_poll)", "cfg(tokio_allow_from_blocking_fd)", "cfg(tokio_internal_mt_counters)", "cfg(tokio_no_parking_lot)", "cfg(tokio_no_tuning_tests)", "cfg(tokio_unstable)", 'cfg(target_os, values("cygwin"))']
level = "warn"
priority = 0

[package]
authors = ["Tokio Contributors <team@tokio.rs>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["asynchronous"]
description = """
Additional utilities for working with Tokio.
"""
edition = "2021"
homepage = "https://tokio.rs"
license = "MIT"
name = "tokio-util"
readme = "README.md"
repository = "https://github.com/tokio-rs/tokio"
rust-version = "1.71"
version = "0.7.18"

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "docsrs", "--cfg", "tokio_unstable"]
rustdoc-args = ["--cfg", "docsrs", "--cfg", "tokio_unstable"]

[package.metadata.playground]
features = ["full"]

[target."cfg(loom)".dev-dependencies.loom]
features = ["futures", "checkpoint"]
version = "0.7"

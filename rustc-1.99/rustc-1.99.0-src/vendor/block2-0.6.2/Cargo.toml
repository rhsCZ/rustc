[dependencies.objc2]
default-features = false
features = ["std"]
version = ">=0.6.2, <0.8.0"

[dev-dependencies]

[features]
alloc = []
compiler-rt = ["objc2/unstable-compiler-rt"]
default = ["std"]
gnustep-1-7 = ["objc2/gnustep-1-7"]
gnustep-1-8 = ["gnustep-1-7", "objc2/gnustep-1-8"]
gnustep-1-9 = ["gnustep-1-8", "objc2/gnustep-1-9"]
gnustep-2-0 = ["gnustep-1-9", "objc2/gnustep-2-0"]
gnustep-2-1 = ["gnustep-2-0", "objc2/gnustep-2-1"]
std = ["alloc"]
unstable-coerce-pointee = []
unstable-objfw = []
unstable-private = []
unstable-winobjc = ["gnustep-1-8"]

[lib]
path = "src/lib.rs"

[lints.clippy]
ptr_as_ptr = "warn"
redundant_feature_names = "allow"

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.rust]
elided_lifetimes_in_paths = "warn"
missing_copy_implementations = "warn"
non_ascii_idents = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[package]
authors = ["Mads Marquart <mads@marquart.dk>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["api-bindings", "development-tools::ffi", "os::macos-apis", "external-ffi-bindings"]
description = "Apple's C language extension of blocks"
edition = "2021"
keywords = ["objective-c", "macos", "ios", "blocks"]
license = "MIT"
name = "block2"
readme = "README.md"
repository = "https://github.com/madsmtm/objc2"
rust-version = "1.71"
version = "0.6.2"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
features = ["unstable-private"]
rustc-args = ["--cfg", "docsrs"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-tvos", "aarch64-apple-watchos", "aarch64-apple-ios-macabi", "aarch64-apple-visionos", "x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu"]

[package.metadata.release]
shared-version = false
tag-prefix = "block2"

[dependencies.futures-core]
optional = true
version = "0.3.22"

[dependencies.futures-util]
default-features = false
features = ["alloc"]
optional = true
version = "0.3.22"

[dependencies.hdrhistogram]
default-features = false
optional = true
version = "7.0"

[dependencies.indexmap]
optional = true
version = "2.0.2"

[dependencies.pin-project-lite]
optional = true
version = "0.2.7"

[dependencies.slab]
optional = true
version = "0.4.9"

[dependencies.sync_wrapper]
optional = true
version = "1"

[dependencies.tokio]
optional = true
version = "1.6.2"

[dependencies.tokio-util]
default-features = false
optional = true
version = "0.7.0"

[dependencies.tower-layer]
version = "0.3.3"

[dependencies.tower-service]
version = "0.3.3"

[dependencies.tracing]
default-features = false
features = ["std"]
optional = true
version = "0.1.2"

[dev-dependencies.futures]
default-features = false
features = ["std"]
version = "0.3.22"

[dev-dependencies.futures-util]
default-features = false
features = ["async-await-macro"]
version = "0.3.22"

[dev-dependencies.hdrhistogram]
default-features = false
version = "7.0"

[dev-dependencies.http]
version = "1"

[dev-dependencies.quickcheck]
version = "1"

[dev-dependencies.rand]
features = ["small_rng"]
version = "0.9"

[dev-dependencies.tokio]
features = ["macros", "sync", "test-util", "rt-multi-thread"]
version = "1.6.2"

[dev-dependencies.tokio-stream]
version = "0.1.1"

[dev-dependencies.tokio-test]
version = "0.4"

[dev-dependencies.tower-test]
version = "0.4"

[dev-dependencies.tracing]
default-features = false
features = ["std"]
version = "0.1.2"

[dev-dependencies.tracing-subscriber]
default-features = false
features = ["fmt", "ansi"]
version = "0.3"

[features]
balance = ["discover", "load", "ready-cache", "make", "slab", "util"]
buffer = ["tokio/sync", "tokio/rt", "tokio-util", "tracing", "pin-project-lite"]
discover = ["futures-core", "pin-project-lite"]
filter = ["futures-util", "pin-project-lite"]
full = ["balance", "buffer", "discover", "filter", "hedge", "limit", "load", "load-shed", "make", "ready-cache", "reconnect", "retry", "spawn-ready", "steer", "timeout", "util"]
hedge = ["util", "filter", "futures-util", "hdrhistogram", "tokio/time", "tracing"]
limit = ["tokio/time", "tokio/sync", "tokio-util", "tracing", "pin-project-lite"]
load = ["tokio/time", "tracing", "pin-project-lite"]
load-shed = ["pin-project-lite"]
log = ["tracing/log"]
make = ["pin-project-lite", "tokio"]
ready-cache = ["futures-core", "futures-util", "indexmap", "tokio/sync", "tracing", "pin-project-lite"]
reconnect = ["make", "tracing"]
retry = ["tokio/time", "util"]
spawn-ready = ["futures-util", "tokio/sync", "tokio/rt", "util", "tracing"]
steer = []
timeout = ["pin-project-lite", "tokio/time"]
tokio-stream = []
util = ["futures-core", "futures-util", "pin-project-lite", "sync_wrapper"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Tower Maintainers <team@tower-rs.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["asynchronous", "network-programming"]
description = """
Tower is a library of modular and reusable components for building robust
clients and servers.
"""
edition = "2018"
homepage = "https://github.com/tower-rs/tower"
keywords = ["io", "async", "non-blocking", "futures", "service"]
license = "MIT"
name = "tower"
readme = "README.md"
repository = "https://github.com/tower-rs/tower"
rust-version = "1.64.0"
version = "0.5.3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.playground]
features = ["full"]

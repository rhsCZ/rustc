[dependencies.bitflags]
default-features = false
features = ["std"]
optional = true
version = "2.5.0"

[dependencies.libc]
default-features = false
optional = true
version = "0.2.80"

[dependencies.objc2]
default-features = false
features = ["std"]
optional = true
version = ">=0.6.2, <0.8.0"

[dependencies.objc2-core-foundation]
default-features = false
features = ["CFDictionary"]
optional = true
version = "0.3.2"

[dependencies.objc2-foundation]
default-features = false
features = ["NSDictionary", "NSObject", "NSString", "alloc"]
optional = true
version = "0.3.2"

[features]
IOSurface = []
IOSurfaceAPI = []
IOSurfaceBase = []
IOSurfaceRef = ["bitflags"]
IOSurfaceTypes = ["bitflags"]
ObjC = ["objc2"]
alloc = []
bitflags = ["dep:bitflags"]
default = ["std", "IOSurface", "IOSurfaceAPI", "IOSurfaceBase", "IOSurfaceRef", "IOSurfaceTypes", "bitflags", "libc", "objc2", "objc2-core-foundation", "objc2-foundation"]
libc = ["dep:libc"]
objc2 = ["dep:objc2", "objc2-core-foundation?/objc2"]
objc2-core-foundation = ["dep:objc2-core-foundation"]
objc2-foundation = ["dep:objc2-foundation"]
std = ["alloc"]
unstable-darwin-objc = []

[lib]
path = "src/lib.rs"

[lints.clippy]
ptr_as_ptr = "warn"
redundant_feature_names = "allow"

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.rust]
elided_lifetimes_in_paths = "warn"
missing_copy_implementations = "warn"
non_ascii_idents = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["api-bindings", "development-tools::ffi", "external-ffi-bindings", "os::macos-apis"]
description = "Bindings to the IOSurface framework"
edition = "2021"
keywords = ["cocoa", "apple", "framework", "macos", "ios"]
license = "Zlib OR Apache-2.0 OR MIT"
name = "objc2-io-surface"
readme = "README.md"
repository = "https://github.com/madsmtm/objc2"
rust-version = "1.71"
version = "0.3.2"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
rustc-args = ["--cfg", "docsrs"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-tvos", "aarch64-apple-ios-macabi", "aarch64-apple-visionos"]

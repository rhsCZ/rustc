[badges.maintenance]
status = "experimental"

[dependencies.proc-macro2]
version = "1.0.60"

[dependencies.quote]
version = "1.0.20"

[dependencies.syn]
default-features = false
features = ["full", "parsing", "printing", "visit-mut", "clone-impls", "extra-traits", "proc-macro"]
version = "2.0"

[dev-dependencies.async-trait]
version = "0.1.67"

[dev-dependencies.rustversion]
version = "1.0.9"

[dev-dependencies.tokio-test]
version = "0.4.2"

[dev-dependencies.tracing]
version = "0.1.35"

[dev-dependencies.tracing-subscriber]
features = ["env-filter"]
version = "0.3.0"

[dev-dependencies.trybuild]
version = "1.0.64"

[features]
async-await = []

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(flaky_tests)", "cfg(tracing_unstable)"]
level = "warn"
priority = 0

[package]
authors = ["Tokio Contributors <team@tokio.rs>", "Eliza Weisman <eliza@buoyant.io>", "David Barsky <dbarsky@amazon.com>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
categories = ["development-tools::debugging", "development-tools::profiling", "asynchronous"]
description = """
Procedural macro attributes for automatically instrumenting functions.
"""
edition = "2018"
homepage = "https://tokio.rs"
keywords = ["logging", "tracing", "macro", "instrument", "log"]
license = "MIT"
name = "tracing-attributes"
readme = "README.md"
repository = "https://github.com/tokio-rs/tracing"
resolver = "2"
rust-version = "1.63.0"
version = "0.1.28"

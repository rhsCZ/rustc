[dependencies.zeroize]
optional = true
version = "1"

[features]
alloc = ["dep:zeroize"]
default = ["alloc"]
std = ["alloc"]
web = ["web-time"]

[lib]
path = "src/lib.rs"

[lints.rust]
elided_lifetimes_in_paths = "warn"
trivial_numeric_casts = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(rustls_pki_types_docsrs)"]
level = "warn"
priority = 0

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["network-programming", "data-structures", "cryptography"]
description = "Shared types for the rustls PKI ecosystem"
documentation = "https://docs.rs/rustls-pki-types"
edition = "2021"
homepage = "https://github.com/rustls/pki-types"
include = ["Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "src/**/*.rs", "README.md", "src/data/*.der"]
license = "MIT OR Apache-2.0"
name = "rustls-pki-types"
readme = "README.md"
repository = "https://github.com/rustls/pki-types"
rust-version = "1.60"
version = "1.14.0"

[package.metadata.cargo_check_external_types]
allowed_external_types = ["zeroize::Zeroize"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "rustls_pki_types_docsrs"]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.web-time]
optional = true
version = "1"

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dev-dependencies.crabgrind]
version = "=0.1.9"

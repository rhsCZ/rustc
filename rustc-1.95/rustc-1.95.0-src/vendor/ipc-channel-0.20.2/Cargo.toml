[dependencies.bincode]
version = "1"

[dependencies.crossbeam-channel]
version = "0.5"

[dependencies.fnv]
version = "1.0.3"

[dependencies.futures-channel]
optional = true
version = "0.3.31"

[dependencies.futures-core]
optional = true
version = "0.3.31"

[dependencies.libc]
version = "0.2.162"

[dependencies.serde]
features = ["rc"]
version = "1.0"

[dependencies.uuid]
features = ["v4"]
version = "1"

[dev-dependencies.criterion]
features = ["html_reports"]
version = "0.5"

[dev-dependencies.crossbeam-utils]
version = "0.8"

[dev-dependencies.futures-test]
version = "0.3"

[dev-dependencies.rand]
version = "0.9.2"

[dev-dependencies.static_assertions]
version = "1.1.0"

[features]
async = ["dep:futures-core", "dep:futures-channel"]
default = []
enable-slow-tests = []
force-inprocess = []
win32-trace = []

[lib]
path = "src/lib.rs"

[package]
authors = ["The Servo Project Developers"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
description = "A multiprocess drop-in replacement for Rust channels"
edition = "2021"
license = "MIT OR Apache-2.0"
name = "ipc-channel"
readme = "README.md"
repository = "https://github.com/servo/ipc-channel"
version = "0.20.2"

[target.'cfg(any(target_os = "linux", target_os = "openbsd", target_os = "freebsd", target_os = "illumos"))'.dependencies.mio]
default-features = false
features = ["os-ext"]
version = "1.0"

[target.'cfg(any(target_os = "linux", target_os = "openbsd", target_os = "freebsd", target_os = "illumos"))'.dependencies.tempfile]
version = "3.4"

[target.'cfg(target_os = "macos")'.dependencies.rand]
version = "0.9"

[target.'cfg(target_os = "windows")'.dependencies.windows]
features = ["Win32_Foundation", "Win32_System_WindowsProgramming", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_Memory", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_Security"]
version = "0.61"

[dependencies.bitflags]
default-features = false
features = ["std"]
version = "2.5.0"

[dependencies.block2]
default-features = false
features = ["alloc"]
optional = true
version = ">=0.6.1, <0.8.0"

[dependencies.libc]
default-features = false
optional = true
version = "0.2.80"

[dependencies.objc2]
default-features = false
features = ["std"]
optional = true
version = ">=0.6.1, <0.8.0"

[dev-dependencies.static_assertions]
version = "1.1.0"

[features]
alloc = []
block2 = ["dep:block2"]
default = ["std", "block2", "libc", "objc2"]
libc = ["dep:libc"]
objc2 = ["dep:objc2"]
std = ["alloc"]

[lib]
path = "src/lib.rs"

[lints.clippy]
ptr_as_ptr = "warn"
redundant_feature_names = "allow"

[lints.clippy.cargo]
level = "warn"
priority = -1

[lints.rust]
elided_lifetimes_in_paths = "warn"
missing_copy_implementations = "warn"
non_ascii_idents = "deny"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"

[package]
authors = ["Mads Marquart <mads@marquart.dk>", "Mary <mary@mary.zone>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["api-bindings", "development-tools::ffi", "external-ffi-bindings", "os::macos-apis"]
description = "Bindings and wrappers for Apple's Grand Central Dispatch (GCD)"
edition = "2021"
keywords = ["gcd", "macos", "ios", "dispatch", "libdispatch"]
license = "Zlib OR Apache-2.0 OR MIT"
name = "dispatch2"
readme = "README.md"
repository = "https://github.com/madsmtm/objc2"
rust-version = "1.71"
version = "0.3.0"

[package.metadata.docs.rs]
default-target = "aarch64-apple-darwin"
rustc-args = ["--cfg", "docsrs"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-apple-ios", "aarch64-apple-tvos", "aarch64-apple-watchos", "aarch64-apple-ios-macabi", "aarch64-apple-visionos", "x86_64-unknown-linux-gnu", "i686-unknown-linux-gnu"]

[package.metadata.release]
shared-version = false
tag-prefix = "dispatch"

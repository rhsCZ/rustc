[badges.appveyor]
repository = "BurntSushi/regex-automata"

[badges.travis-ci]
repository = "BurntSushi/regex-automata"

[dependencies.fst]
optional = true
version = "0.4.0"

[dependencies.regex-syntax]
optional = true
version = "0.6.16"

[dev-dependencies.bstr]
default-features = false
features = ["std"]
version = "0.2"

[dev-dependencies.lazy_static]
version = "1.2.0"

[dev-dependencies.regex]
version = "1.1"

[dev-dependencies.serde]
version = "1.0.82"

[dev-dependencies.serde_bytes]
version = "0.11"

[dev-dependencies.serde_derive]
version = "1.0.82"

[dev-dependencies.toml]
version = "0.4.10"

[features]
default = ["std"]
std = ["regex-syntax"]
transducer = ["std", "fst"]

[lib]
path = "src/lib.rs"

[package]
authors = ["Andrew Gallant <jamslam@gmail.com>"]
autoexamples = false
autotests = false
categories = ["text-processing"]
description = "Automata construction and matching using regular expressions."
documentation = "https://docs.rs/regex-automata"
exclude = ["/.travis.yml", "/appveyor.yml", "/ci/*", "/scripts/*", "/regex-automata-debug"]
homepage = "https://github.com/BurntSushi/regex-automata"
keywords = ["regex", "dfa", "automata", "automaton", "nfa"]
license = "Unlicense/MIT"
name = "regex-automata"
readme = "README.md"
repository = "https://github.com/BurntSushi/regex-automata"
version = "0.1.10"

[profile.bench]
debug = true

[profile.dev]
debug = true
opt-level = 3

[profile.release]
debug = true

[profile.test]
debug = true
opt-level = 3

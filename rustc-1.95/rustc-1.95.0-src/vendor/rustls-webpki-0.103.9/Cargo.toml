[dependencies.aws-lc-rs]
default-features = false
optional = true
version = "1.14"

[dependencies.pki-types]
default-features = false
package = "rustls-pki-types"
version = "1.12"

[dependencies.ring]
default-features = false
optional = true
version = "0.17"

[dependencies.untrusted]
version = "0.9"

[dev-dependencies.base64]
version = "0.22"

[dev-dependencies.bencher]
version = "0.1.5"

[dev-dependencies.bzip2]
version = "0.6"

[dev-dependencies.once_cell]
version = "1.17.2"

[dev-dependencies.rcgen]
default-features = false
features = ["aws_lc_rs"]
version = "0.14.2"

[dev-dependencies.serde]
features = ["derive"]
version = "1.0"

[dev-dependencies.serde_json]
version = "1.0"

[features]
alloc = ["ring?/alloc", "pki-types/alloc"]
aws-lc-rs = ["dep:aws-lc-rs", "aws-lc-rs/aws-lc-sys", "aws-lc-rs/prebuilt-nasm"]
aws-lc-rs-fips = ["dep:aws-lc-rs", "aws-lc-rs/fips"]
aws-lc-rs-unstable = ["aws-lc-rs", "aws-lc-rs/unstable"]
default = ["std"]
ring = ["dep:ring"]
std = ["alloc", "pki-types/std"]

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(webpki_docsrs)"]
level = "warn"
priority = 0

[package]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["cryptography", "no-std"]
description = "Web PKI X.509 Certificate Verification."
edition = "2021"
include = ["Cargo.toml", "/LICENSE", "/README.md", "src/aws_lc_rs_algs.rs", "src/calendar.rs", "src/cert.rs", "src/crl/mod.rs", "src/crl/types.rs", "src/data/", "src/der.rs", "src/end_entity.rs", "src/error.rs", "src/rpk_entity.rs", "src/subject_name/dns_name.rs", "src/subject_name/ip_address.rs", "src/subject_name/mod.rs", "src/subject_name/name.rs", "src/subject_name/verify.rs", "src/name/verify.rs", "src/name/name.rs", "src/signed_data.rs", "src/ring_algs.rs", "src/alg_tests.rs", "src/time.rs", "src/trust_anchor.rs", "src/x509.rs", "src/verify_cert.rs", "src/lib.rs"]
license = "ISC"
name = "rustls-webpki"
readme = "README.md"
repository = "https://github.com/rustls/webpki"
rust-version = "1.71"
version = "0.103.9"

[package.metadata.cargo-semver-checks.lints]
enum_variant_marked_deprecated = "warn"

[package.metadata.cargo_check_external_types]
allowed_external_types = ["rustls_pki_types::*", "rustls_pki_types"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "webpki_docsrs"]

[profile.bench]
codegen-units = 1
debug = 0
debug-assertions = false
lto = true
opt-level = 3
rpath = false

[profile.release]
codegen-units = 1
debug = 0
debug-assertions = false
lto = true
opt-level = 3
rpath = false

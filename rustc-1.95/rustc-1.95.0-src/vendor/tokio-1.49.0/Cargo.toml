[dependencies.bytes]
optional = true
version = "1.2.1"

[dependencies.mio]
default-features = false
optional = true
version = "1.0.1"

[dependencies.parking_lot]
optional = true
version = "0.12.0"

[dependencies.pin-project-lite]
version = "0.2.11"

[dependencies.tokio-macros]
optional = true
version = "~2.6.0"

[dev-dependencies.async-stream]
version = "0.3"

[dev-dependencies.futures]
features = ["async-await"]
version = "0.3.0"

[dev-dependencies.futures-concurrency]
version = "7.6.3"

[dev-dependencies.futures-test]
version = "0.3.31"

[dev-dependencies.mockall]
version = "0.13.0"

[dev-dependencies.tokio-stream]
version = "0.1"

[dev-dependencies.tokio-test]
version = "0.4.0"

[dev-dependencies.tokio-util]
features = ["rt"]
version = "0.7"

[features]
default = []
fs = []
full = ["fs", "io-util", "io-std", "macros", "net", "parking_lot", "process", "rt", "rt-multi-thread", "signal", "sync", "time"]
io-std = []
io-uring = ["dep:io-uring", "libc", "mio/os-poll", "mio/os-ext", "dep:slab"]
io-util = ["bytes"]
macros = ["tokio-macros"]
net = ["libc", "mio/os-poll", "mio/os-ext", "mio/net", "socket2", "windows-sys/Win32_Foundation", "windows-sys/Win32_Security", "windows-sys/Win32_Storage_FileSystem", "windows-sys/Win32_System_Pipes", "windows-sys/Win32_System_SystemServices"]
process = ["bytes", "libc", "mio/os-poll", "mio/os-ext", "mio/net", "signal-hook-registry", "windows-sys/Win32_Foundation", "windows-sys/Win32_System_Threading", "windows-sys/Win32_System_WindowsProgramming"]
rt = []
rt-multi-thread = ["rt"]
signal = ["libc", "mio/os-poll", "mio/net", "mio/os-ext", "signal-hook-registry", "windows-sys/Win32_Foundation", "windows-sys/Win32_System_Console"]
sync = []
taskdump = ["dep:backtrace"]
test-util = ["rt", "sync", "time"]
time = []

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(fuzzing)", "cfg(loom)", "cfg(mio_unsupported_force_poll_poll)", "cfg(tokio_allow_from_blocking_fd)", "cfg(tokio_internal_mt_counters)", "cfg(tokio_no_parking_lot)", "cfg(tokio_no_tuning_tests)", "cfg(tokio_unstable)", 'cfg(target_os, values("cygwin"))']
level = "warn"
priority = 0

[package]
authors = ["Tokio Contributors <team@tokio.rs>"]
autobenches = false
autobins = false
autoexamples = false
autotests = false
categories = ["asynchronous", "network-programming"]
description = """
An event-driven, non-blocking I/O platform for writing asynchronous I/O
backed applications.
"""
edition = "2021"
homepage = "https://tokio.rs"
keywords = ["io", "async", "non-blocking", "futures"]
license = "MIT"
name = "tokio"
readme = "README.md"
repository = "https://github.com/tokio-rs/tokio"
rust-version = "1.71"
version = "1.49.0"

[package.metadata.cargo_check_external_types]
allowed_external_types = ["bytes::buf::buf_impl::Buf", "bytes::buf::buf_mut::BufMut", "tokio_macros::*"]

[package.metadata.docs.rs]
all-features = true
rustc-args = ["--cfg", "tokio_unstable"]
rustdoc-args = ["--cfg", "docsrs", "--cfg", "tokio_unstable"]

[package.metadata.playground]
features = ["full", "test-util"]

[target.'cfg(all(target_family = "wasm", not(target_os = "wasi")))'.dev-dependencies.wasm-bindgen-test]
version = "0.3.0"

[target.'cfg(all(tokio_unstable, target_has_atomic = "64"))'.dev-dependencies.tracing-mock]
version = "= 0.1.0-beta.1"

[target.'cfg(all(tokio_unstable, target_os = "linux"))'.dependencies.backtrace]
optional = true
version = "0.3.58"

[target.'cfg(all(tokio_unstable, target_os = "linux"))'.dependencies.io-uring]
default-features = false
optional = true
version = "0.7.6"

[target.'cfg(all(tokio_unstable, target_os = "linux"))'.dependencies.libc]
optional = true
version = "0.2.168"

[target.'cfg(all(tokio_unstable, target_os = "linux"))'.dependencies.mio]
default-features = false
features = ["os-poll", "os-ext"]
optional = true
version = "1.0.1"

[target.'cfg(all(tokio_unstable, target_os = "linux"))'.dependencies.slab]
optional = true
version = "0.4.9"

[target."cfg(loom)".dev-dependencies.loom]
features = ["futures", "checkpoint"]
version = "0.7"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies.rand]
version = "0.9"

[target.'cfg(not(target_family = "wasm"))'.dependencies.socket2]
features = ["all"]
optional = true
version = "0.6.0"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.proptest]
version = "1"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.socket2]
version = "0.6.0"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies.tempfile]
version = "3.1.0"

[target.'cfg(target_os = "freebsd")'.dev-dependencies.mio-aio]
features = ["tokio"]
version = "1"

[target."cfg(tokio_unstable)".dependencies.tracing]
default-features = false
features = ["std"]
optional = true
version = "0.1.29"

[target."cfg(unix)".dependencies.libc]
optional = true
version = "0.2.168"

[target."cfg(unix)".dependencies.signal-hook-registry]
optional = true
version = "1.1.1"

[target."cfg(unix)".dev-dependencies.libc]
version = "0.2.168"

[target."cfg(unix)".dev-dependencies.nix]
default-features = false
features = ["aio", "fs", "socket"]
version = "0.29.0"

[target."cfg(windows)".dependencies.windows-sys]
optional = true
version = "0.61"

[target."cfg(windows)".dev-dependencies.windows-sys]
features = ["Win32_Foundation", "Win32_Security_Authorization"]
version = "0.61"

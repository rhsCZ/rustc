[dependencies.base64]
version = "0.22"

[dependencies.bytes]
version = "1.2"

[dependencies.futures-core]
default-features = false
version = "0.3.28"

[dependencies.futures-util]
default-features = false
optional = true
version = "0.3.28"

[dependencies.http]
version = "1.1"

[dependencies.mime_guess]
default-features = false
optional = true
version = "2.0"

[dependencies.serde]
optional = true
version = "1.0"

[dependencies.serde_json]
optional = true
version = "1.0"

[dependencies.serde_urlencoded]
optional = true
version = "0.7.1"

[dependencies.sync_wrapper]
features = ["futures"]
version = "1.0"

[dependencies.url]
version = "2.4"

[dev-dependencies.libc]
version = "0"

[dev-dependencies.num_cpus]
version = "1.0"

[dev-dependencies.tower]
default-features = false
features = ["limit"]
version = "0.5.2"

[features]
__native-tls = ["dep:hyper-tls", "dep:native-tls-crate", "__tls", "dep:tokio-native-tls"]
__native-tls-alpn = ["native-tls-crate?/alpn", "hyper-tls?/alpn"]
__rustls = ["dep:hyper-rustls", "dep:tokio-rustls", "dep:rustls", "__tls"]
__rustls-aws-lc-rs = ["hyper-rustls?/aws-lc-rs", "tokio-rustls?/aws-lc-rs", "rustls?/aws-lc-rs", "quinn?/rustls-aws-lc-rs"]
__tls = ["dep:rustls-pki-types", "tokio/io-util"]
blocking = ["dep:futures-channel", "futures-channel?/sink", "dep:futures-util", "futures-util?/io", "futures-util?/sink", "tokio/sync"]
brotli = ["tower-http/decompression-br"]
charset = ["dep:encoding_rs", "dep:mime"]
cookies = ["dep:cookie_crate", "dep:cookie_store"]
default = ["default-tls", "charset", "http2", "system-proxy"]
default-tls = ["rustls"]
deflate = ["tower-http/decompression-deflate"]
form = ["dep:serde", "dep:serde_urlencoded"]
gzip = ["tower-http/decompression-gzip"]
hickory-dns = ["dep:hickory-resolver", "dep:once_cell"]
http2 = ["dep:h2", "hyper/http2", "hyper-util/http2", "hyper-rustls?/http2"]
http3 = ["rustls", "dep:h3", "dep:h3-quinn", "dep:quinn", "tokio/macros"]
json = ["dep:serde", "dep:serde_json"]
multipart = ["dep:mime_guess", "dep:futures-util"]
native-tls = ["__native-tls", "__native-tls-alpn"]
native-tls-no-alpn = ["__native-tls"]
native-tls-vendored = ["__native-tls", "native-tls-crate?/vendored", "__native-tls-alpn"]
native-tls-vendored-no-alpn = ["__native-tls", "native-tls-crate?/vendored"]
query = ["dep:serde", "dep:serde_urlencoded"]
rustls = ["__rustls-aws-lc-rs", "dep:rustls-platform-verifier", "__rustls"]
rustls-no-provider = ["dep:rustls-platform-verifier", "__rustls"]
socks = []
stream = ["tokio/fs", "dep:futures-util", "dep:tokio-util", "dep:wasm-streams"]
system-proxy = ["hyper-util/client-proxy-system"]
zstd = ["tower-http/decompression-zstd"]

[lib]
path = "src/lib.rs"

[lints.rust.unexpected_cfgs]
check-cfg = ["cfg(reqwest_unstable)"]
level = "warn"
priority = 0

[package]
authors = ["Sean McArthur <sean@seanmonstar.com>"]
autobenches = false
autobins = false
autoexamples = false
autolib = false
autotests = false
categories = ["web-programming::http-client", "wasm"]
description = "higher level HTTP client library"
documentation = "https://docs.rs/reqwest"
edition = "2021"
include = ["README.md", "Cargo.toml", "LICENSE-APACHE", "LICENSE-MIT", "src/**/*.rs"]
keywords = ["http", "request", "client"]
license = "MIT OR Apache-2.0"
name = "reqwest"
readme = "README.md"
repository = "https://github.com/seanmonstar/reqwest"
rust-version = "1.64.0"
version = "0.13.1"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs", "--cfg", "reqwest_unstable"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[package.metadata.playground]
features = ["blocking", "cookies", "query", "form", "json", "multipart"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cookie_crate]
optional = true
package = "cookie"
version = "0.18.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.cookie_store]
optional = true
version = "0.22.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.encoding_rs]
optional = true
version = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.futures-channel]
